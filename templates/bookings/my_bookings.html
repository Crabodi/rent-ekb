{% extends 'base.html' %}

{% block title %}Мои бронирования - Рент.ру{% endblock %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4">Мои бронирования</h2>
    
    <ul class="nav nav-tabs mb-4" id="bookingTabs">
        <li class="nav-item">
            <button class="nav-link active" data-status="pending">Ожидают подтверждения</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-status="confirmed">Подтверждены</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-status="cancelled">Отменены</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-status="completed">Завершены</button>
        </li>
    </ul>
    
    <div id="bookingsList">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Загрузка...</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    let currentStatus = 'pending';
    let currentUserRole = '{{ user.role }}';
    let allBookings = [];
    
    function getAccessToken() {
        return sessionStorage.getItem('access_token') || '{{ access_token|default:"" }}';
    }
    
    function loadMyBookings() {
        $('#bookingsList').html(`
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
            </div>
        `);
        
        const token = getAccessToken();
        
        $.ajax({
            url: API_URL + 'bookings/',
            method: 'GET',
            headers: {
                'Authorization': 'Bearer ' + token,
                'X-CSRFToken': getCookie('csrftoken')
            },
            success: function(data) {
                console.log('Bookings loaded:', data);
                allBookings = Array.isArray(data) ? data : (data.results || []);
                displayBookings();
            },
            error: function(xhr, status, error) {
                console.error('Error loading bookings:', error);
                if (xhr.status === 401) {
                    $('#bookingsList').html(`
                        <div class="alert alert-warning text-center">
                            <i class="bi bi-exclamation-triangle"></i> 
                            Сессия истекла. Пожалуйста, 
                            <a href="/login/">войдите</a> заново.
                        </div>
                    `);
                } else {
                    $('#bookingsList').html(`
                        <div class="alert alert-danger text-center">
                            <i class="bi bi-exclamation-triangle"></i> 
                            Ошибка загрузки бронирований: ${error}
                        </div>
                    `);
                }
            }
        });
    }
    
    function displayBookings() {
        let filteredBookings = allBookings.filter(b => b.status === currentStatus);

        if (filteredBookings.length === 0) {
            let message = 'Нет бронирований';
            if (currentStatus === 'pending') {
                message = 'Нет ожидающих подтверждения бронирований';
            }
            $('#bookingsList').html(`
                <div class="alert alert-info text-center">
                    <i class="bi bi-info-circle"></i> ${message}
                </div>
            `);
            return;
        }
        
        let html = '<div class="list-group">';
        filteredBookings.forEach(booking => {
            const isPending = booking.status === 'pending';
            // Используем поле is_owner из API
            const isUserOwner = booking.is_owner === true;
            
            html += `
                <div class="list-group-item">
                    <div class="row align-items-start">
                        <div class="col-md-8">
                            <h5 class="mb-1">
                                <a href="/property/${booking.property_obj_id || booking.property_obj}/" target="_blank" class="text-decoration-none">
                                    ${escapeHtml(booking.property_title)}
                                    <i class="bi bi-box-arrow-up-right" style="font-size: 12px;"></i>
                                </a>
                            </h5>
                            <p class="mb-1">
                                <i class="bi bi-calendar"></i> ${escapeHtml(booking.display_dates || 'Даты не указаны')}
                            </p>
                            <p class="mb-1">
                                <strong>${parseFloat(booking.total_price).toLocaleString('ru-RU')} ₽</strong>
                            </p>
                            ${booking.tenant_name ? `
                                <p class="mb-1 text-muted">
                                    <i class="bi bi-person"></i> Арендатор: ${escapeHtml(booking.tenant_name)}
                                </p>
                            ` : ''}
                            ${booking.tenant_comment ? `
                                <p class="mb-1 text-muted">
                                    <i class="bi bi-chat"></i> Комментарий: ${escapeHtml(booking.tenant_comment)}
                                </p>
                            ` : ''}
                            ${booking.owner_response_comment ? `
                                <p class="mb-1 text-info">
                                    <i class="bi bi-reply"></i> Ответ владельца: ${escapeHtml(booking.owner_response_comment)}
                                </p>
                            ` : ''}
                        </div>
                        <div class="col-md-4 text-end">
                            <span class="badge bg-${getStatusClass(booking.status)} fs-6 mb-2">
                                ${getStatusText(booking.status)}
                            </span>
                            ${isUserOwner && isPending ? `
                                <div class="mt-2">
                                    <button class="btn btn-sm btn-success me-1" onclick="actionBooking(${booking.id}, 'confirm', '${escapeHtml(booking.tenant_name || 'арендатора')}')">
                                        <i class="bi bi-check-circle"></i> Подтвердить
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="actionBooking(${booking.id}, 'cancel', '${escapeHtml(booking.tenant_name || 'арендатора')}')">
                                        <i class="bi bi-x-circle"></i> Отказать
                                    </button>
                                </div>
                            ` : ''}
                            ${!isUserOwner && isPending ? `
                                <div class="mt-2">
                                    <button class="btn btn-sm btn-danger" onclick="actionBooking(${booking.id}, 'cancel_tenant', '${escapeHtml(booking.property_title)}')">
                                        <i class="bi bi-x-circle"></i> Отменить
                                    </button>
                                </div>
                            ` : ''}
                            ${!isPending ? `
                                <div class="mt-2">
                                    <a href="/property/${booking.property_obj_id || booking.property_obj}/" target="_blank" class="btn btn-sm btn-outline-secondary">
                                        <i class="bi bi-eye"></i> Просмотр объявления
                                    </a>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        $('#bookingsList').html(html);
    }
    
    window.actionBooking = function(bookingId, action, name) {
        let message = '';
        let url = '';
        
        if (action === 'confirm') {
            message = `Подтверждение бронирования для ${name}\n\nВведите комментарий (необязательно):`;
            url = API_URL + `bookings/${bookingId}/confirm/`;
        } else {
            message = `Отмена бронирования для ${name}\n\nВведите причину (необязательно):`;
            url = API_URL + `bookings/${bookingId}/cancel/`;
        }
        
        const comment = prompt(message);
        const token = getAccessToken();
        
        $.ajax({
            url: url,
            method: 'POST',
            contentType: 'application/json',
            headers: {
                'Authorization': 'Bearer ' + token,
                'X-CSRFToken': getCookie('csrftoken')
            },
            data: JSON.stringify({ comment: comment || '', reason: comment || '' }),
            success: function(response) {
                showNotification(response.message, 'success');
                loadMyBookings();
            },
            error: function(xhr) {
                const error = xhr.responseJSON;
                if (xhr.status === 401) {
                    showNotification('Сессия истекла. Пожалуйста, войдите заново.', 'warning');
                    setTimeout(() => window.location.href = '/login/', 2000);
                } else {
                    showNotification(error?.error || error?.detail || 'Ошибка при выполнении операции', 'danger');
                }
            }
        });
    };
    
    function getStatusClass(status) {
        const classes = {
            'pending': 'warning',
            'confirmed': 'success',
            'cancelled': 'danger',
            'completed': 'info'
        };
        return classes[status] || 'secondary';
    }
    
    function getStatusText(status) {
        const texts = {
            'pending': 'Ожидает подтверждения',
            'confirmed': 'Подтверждено',
            'cancelled': 'Отменено',
            'completed': 'Завершено'
        };
        return texts[status] || status;
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    $('#bookingTabs .nav-link').on('click', function() {
        $('#bookingTabs .nav-link').removeClass('active');
        $(this).addClass('active');
        currentStatus = $(this).data('status');
        displayBookings();
    });
    
    loadMyBookings();
});
</script>
{% endblock %}
