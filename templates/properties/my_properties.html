{% extends 'base.html' %}

{% block title %}Мои объявления - Рент.ру{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Мои объявления</h2>
        <a href="{% url 'create_property' %}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Добавить объявление
        </a>
    </div>
    
    <div id="propertiesList">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Загрузка...</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    
    // Отображаем информацию о пользователе
    $('#currentUsername').text(CURRENT_USERNAME || 'Неизвестно');
    $('#currentUserId').text(CURRENT_USER_ID || 'Неизвестно');
    $('#currentUserRole').text(CURRENT_USER_ROLE || 'Неизвестно');
    
    // Проверка авторизации
    if (!CURRENT_USER_ID) {
        $('#propertiesList').html(`
            <div class="alert alert-warning text-center">
                <i class="bi bi-exclamation-triangle"></i> 
                Для просмотра объявлений необходимо 
                <a href="/login/">войти</a> в систему.
            </div>
        `);
        return;
    }
    
    loadMyProperties();
    
    function loadMyProperties() {
        $('#propertiesList').html(`
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
            </div>
        `);
        
        console.log('Loading properties for user ID:', CURRENT_USER_ID);
        
        $.ajax({
            url: API_URL + 'properties/my_properties/',
            method: 'GET',
            headers: {
                'Authorization': 'Bearer ' + getAccessToken(),
                'X-CSRFToken': getCookie('csrftoken')
            },
            success: function(data) {
                console.log('Loaded properties:', data.length);
                // Загружаем бронирования для проверки статуса
                loadBookingsAndDisplay(data);
            },
            error: function(xhr, status, error) {
                console.error('Error loading properties:', error);
                console.error('Status:', xhr.status);
                
                if (xhr.status === 401) {
                    $('#propertiesList').html(`
                        <div class="alert alert-warning text-center">
                            <i class="bi bi-exclamation-triangle"></i> 
                            Сессия истекла. Пожалуйста, 
                            <a href="/login/">войдите</a> заново.
                        </div>
                    `);
                } else {
                    $('#propertiesList').html(`
                        <div class="alert alert-danger text-center">
                            <i class="bi bi-exclamation-triangle"></i> 
                            Ошибка загрузки объявлений. Пожалуйста, попробуйте позже.
                        </div>
                    `);
                }
            }
        });
    }
    
    function loadBookingsAndDisplay(properties) {
        $.ajax({
            url: API_URL + 'bookings/',
            method: 'GET',
            headers: {
                'Authorization': 'Bearer ' + getAccessToken(),
                'X-CSRFToken': getCookie('csrftoken')
            },
            success: function(bookingsData) {
                const bookings = Array.isArray(bookingsData) ? bookingsData : (bookingsData.results || []);
                displayProperties(properties, bookings);
            },
            error: function() {
                displayProperties(properties, []);
            }
        });
    }
    
    function displayProperties(properties, bookings) {
        if (!properties || properties.length === 0) {
            $('#propertiesList').html(`
                <div class="alert alert-info text-center">
                    <i class="bi bi-info-circle"></i> 
                    У вас пока нет объявлений.
                    <a href="{% url 'create_property' %}" class="alert-link">Создать первое объявление</a>
                </div>
            `);
            return;
        }
        
        let html = '<div class="row">';
        properties.forEach(property => {
            let imageUrl = '/static/images/no-image.svg';
            if (property.main_image) {
                imageUrl = property.main_image;
            }
            
            const statusBadge = property.is_active ? 
                '<span class="badge bg-success">Активно</span>' : 
                '<span class="badge bg-secondary">Неактивно</span>';
            
            // Проверяем, есть ли активное долгосрочное бронирование
            const activeBooking = bookings.find(b => 
                b.property_obj === property.id && 
                b.rental_type === 'long_term' && 
                b.status === 'confirmed'
            );
            
            const bookingBadge = activeBooking ? 
                '<span class="badge bg-warning ms-2">ЗАБРОНИРОВАНО</span>' : '';
            
            html += `
                <div class="col-md-4 mb-4">
                    <div class="card property-card h-100">
                        <img src="${imageUrl}" class="card-img-top" style="height: 200px; object-fit: cover;">
                        <div class="card-body">
                            <h5 class="card-title">${escapeHtml(property.title)}</h5>
                            <p class="price">${property.price_display || 'Цена не указана'}</p>
                            <p>${statusBadge} ${bookingBadge}</p>
                            <div class="btn-group w-100">
                                <a href="/property/${property.id}/" class="btn btn-outline-primary btn-sm">Просмотр</a>
                                <button class="btn btn-outline-danger btn-sm" onclick="deleteProperty(${property.id})">Удалить</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        $('#propertiesList').html(html);
    }
    
    window.deleteProperty = function(id) {
        if (confirm('Вы уверены, что хотите удалить это объявление?')) {
            $.ajax({
                url: API_URL + `properties/${id}/`,
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + getAccessToken(),
                    'X-CSRFToken': getCookie('csrftoken')
                },
                success: function() {
                    showNotification('Объявление удалено', 'success');
                    loadMyProperties();
                },
                error: function(xhr) {
                    if (xhr.status === 401) {
                        showNotification('Сессия истекла. Пожалуйста, войдите заново.', 'warning');
                        setTimeout(() => window.location.href = '/login/', 2000);
                    } else {
                        showNotification('Ошибка при удалении', 'danger');
                    }
                }
            });
        }
    };
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
});
</script>
{% endblock %}
